name: macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run JavaScript qualification
        working-directory: app
        run: node tests/run-all.mjs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run native qualification
        working-directory: app/src-tauri
        run: |
          cargo +1.97.1 fmt --check
          cargo +1.97.1 test --locked
          cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - name: Install pinned Tauri CLI
        run: cargo +1.97.1 install tauri-cli --version 2.11.4 --locked
      - name: Build unsigned macOS disk image
        working-directory: app/src-tauri
        run: cargo +1.97.1 tauri build --bundles dmg --config tauri.macos.conf.json
      - name: Generate checksum
        run: shasum -a 256 app/src-tauri/target/release/bundle/dmg/*.dmg > nimvara-macos.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nimvara-macos-unsigned
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            nimvara-macos.sha256
          if-no-files-found: error
